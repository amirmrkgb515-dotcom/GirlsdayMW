<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happy Girls Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#05020a; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  // ================== تنظیمات (اینجا رو شخصی‌سازی کن) ==================
  const HER_NAME = "";   // اسمش رو اینجا بنویس (مثلا "Sara")
  const SCENES = [
    { type: 'text',  lines: ["Happy", "Girls Day"], hold: 7 },
    { type: 'heart', hold: 8 },
    { type: 'text',  lines: ["Hope your day", "is as beautiful", "as you are"], hold: 8 },
    { type: 'heart', hold: 8 }
  ];
  if (HER_NAME) SCENES.push({ type: 'text', lines: [HER_NAME], hold: 7 });
  // =====================================================================

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const off = document.createElement('canvas');
  const octx = off.getContext('2d', { willReadFrequently: true });

  let bgCanvas = document.createElement('canvas');
  let bgCtx = bgCanvas.getContext('2d');

  let dpr = 1, cw = 0, ch = 0, N = 0, S = 100;
  let parts = [], pts = [], stars = [], orbs = [], petals = [], hearts = [], rings = [], shoot = null;
  let clock = 0, last = null, sceneIdx = -1, sceneT = 0, heartAmt = 0, lastPh = 0;
  let nextShoot = 5000, nextHeart = 1500, resizeTimer = null;
  const ptr = { x: -999, y: -999 };

  const rand = (a, b) => a + Math.random() * (b - a);
  const buzz = ms => { try { if (navigator.vibrate && !document.hidden) navigator.vibrate(ms); } catch (e) {} };
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- اسپرایت‌های نورانی ----------
  const COLORS = [[255,214,232],[255,158,199],[255,158,199],[255,92,147],[255,46,99],[255,194,161],[255,233,168]];
  const LIGHT = [0, 0, 1, 6, 2]; // رنگ‌های روشن، فقط برای ذرات متن (خوانایی بیشتر)
  const sprites = COLORS.map(c => {
    const s = document.createElement('canvas'); s.width = s.height = 32;
    const g = s.getContext('2d'), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.15, `rgba(${c},0.9)`);
    gr.addColorStop(0.4, `rgba(${c},0.3)`);
    gr.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
    return s;
  });

  const glow = COLORS.map(c => {   // نسخه‌ی پرنورتر با هاله‌ی پهن‌تر
    const s = document.createElement('canvas'); s.width = s.height = 48;
    const g = s.getContext('2d'), gr = g.createRadialGradient(24, 24, 0, 24, 24, 24);
    gr.addColorStop(0, 'rgba(255,255,255,0.95)');
    gr.addColorStop(0.1, `rgba(${c},1)`);
    gr.addColorStop(0.32, `rgba(${c},0.5)`);
    gr.addColorStop(0.62, `rgba(${c},0.15)`);
    gr.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 48, 48);
    return s;
  });

  function heartPath(c, s) {
    c.beginPath();
    c.moveTo(0, s * 0.35);
    c.bezierCurveTo(-s * 1.1, -s * 0.3, -s * 0.55, -s * 1.15, 0, -s * 0.45);
    c.bezierCurveTo(s * 0.55, -s * 1.15, s * 1.1, -s * 0.3, 0, s * 0.35);
    c.closePath();
  }

  // ---------- استخراج نقاط متن (تراکم تطبیقی تا حروف پر و کامل باشن) ----------
  function textPoints(lines) {
    off.width = cw; off.height = ch;
    const font = '"Pacifico","Brush Script MT","Segoe Script",cursive';
    octx.font = `100px ${font}`;
    let mw = 0; lines.forEach(l => mw = Math.max(mw, octx.measureText(l).width));
    const size = Math.min(100 * cw * 0.9 / mw, ch * 0.65 / (lines.length * 1.4), 180);
    octx.font = `${size}px ${font}`;
    octx.textAlign = 'center'; octx.textBaseline = 'middle';
    octx.fillStyle = '#fff';
    lines.forEach((l, i) => {
      const y = ch * 0.5 + (i - (lines.length - 1) / 2) * size * 1.3;
      octx.fillText(l, cw / 2, y);
    });

    const d = octx.getImageData(0, 0, cw, ch).data;
    let out, step = 2;
    for (;; step++) {
      out = [];
      for (let y = 0; y < ch; y += step)
        for (let x = 0; x < cw; x += step)
          if (d[(y * cw + x) * 4 + 3] > 140) out.push({ x: x + rand(-0.4, 0.4), y: y + rand(-0.4, 0.4), hb: false });
      if (out.length <= N || step >= 4) break;
    }
    return out;
  }

  function heartPoints() {
    const R = Math.min(cw * 0.35, ch * 0.25), cx = cw / 2, cy = ch * 0.47, edge = [], inner = [];
    for (let i = 0; i < 200000 && (edge.length < N * 0.3 || inner.length < N * 0.78); i++) {
      const x = rand(-1.25, 1.25), y = rand(-1.25, 1.3);
      const f = Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y;
      if (f <= 0) (f > -0.13 ? edge : inner).push({ x: cx + x * R + rand(-0.03, 0.03) * R, y: cy - (y - 0.12) * R + rand(-0.03, 0.03) * R, hb: true });
    }
    S = R;
    return shuffle(edge).slice(0, N * 0.3 | 0).concat(shuffle(inner).slice(0, N * 0.78 | 0));
  }

  // ---------- کش کردن پس‌زمینه و هاله‌ها ----------
  function initBackground() {
    bgCanvas.width = cw; bgCanvas.height = ch;
    const bg = bgCtx.createRadialGradient(cw / 2, ch * 0.4, 0, cw / 2, ch * 0.4, Math.max(cw, ch) * 0.85);
    bg.addColorStop(0, '#2d0f3d'); bg.addColorStop(0.5, '#120720'); bg.addColorStop(1, '#04020a');
    bgCtx.fillStyle = bg; bgCtx.fillRect(0, 0, cw, ch);

    stars = Array.from({ length: Math.floor(cw * ch / 7000) }, () => ({
      x: Math.random() * cw, y: Math.random() * ch, r: rand(0.3, 1.3), ph: rand(0, 6.28), sp: rand(0.5, 1.6)
    }));

    orbs = Array.from({ length: 9 }, () => {
      const r = rand(50, 130), hue = rand(300, 350), a = rand(0.04, 0.085);
      const oc = document.createElement('canvas');
      oc.width = oc.height = r * 2;
      const og = oc.getContext('2d');
      const gr = og.createRadialGradient(r, r, 0, r, r, r);
      gr.addColorStop(0, `hsla(${hue},90%,65%,${a})`); gr.addColorStop(1, `hsla(${hue},90%,65%,0)`);
      og.fillStyle = gr; og.fillRect(0, 0, r * 2, r * 2);
      return { x: Math.random() * cw, y: Math.random() * ch, r, ph: rand(0, 6.28), sp: rand(0.05, 0.12), cvs: oc };
    });

    petals = Array.from({ length: Math.max(10, Math.floor(cw / 45)) }, () => newPetal(true));
  }

  function newPetal(anyY) {
    return { x: Math.random() * cw, y: anyY ? Math.random() * ch : -20, s: rand(5, 10), vy: rand(22, 50),
      ph: rand(0, 6.28), fr: rand(0.4, 0.9), amp: rand(15, 35), spin: rand(1, 2.2), rot: rand(0, 6.28), a: rand(0.35, 0.6) };
  }

  function makeParticle() {
    const p = { x: Math.random() * cw, y: Math.random() * ch, vx: 0, vy: 0, ph: rand(0, 6.28), tf: rand(1, 3), c: (Math.random() * COLORS.length) | 0, sw: 0, delay: 0 };
    p.tx = p.nx = p.x; p.ty = p.ny = p.y; p.hb = p.nhb = false; p.fire = p.nfire = true; p.k = p.nk = 1.3; p.s = p.ns = rand(4, 8);
    p.txt = p.ntxt = false; p.dim = p.ndim = 1; p.nc = p.c; p.br = p.nbr = 1; p.hbin = 0;
    return p;
  }

  function goScene(i) {
    sceneIdx = i % SCENES.length; sceneT = 0;
    const isText = SCENES[sceneIdx].type === 'text';
    const list = shuffle(pts[sceneIdx].slice()), n = Math.min(list.length, N);
    const chosen = list.slice(0, n);
    const ang = (x, y) => Math.atan2(y - ch / 2, x - cw / 2);

    chosen.sort((a, b) => ang(a.x, a.y) - ang(b.x, b.y));
    const ps = parts.slice().sort((a, b) => ang(a.x, a.y) - ang(b.x, b.y));

    ps.forEach((p, k) => {
      p.delay = rand(0, 0.5); p.sw = 1; p.nbr = 1;
      if (k < n) {
        const t = chosen[k];
        p.nx = t.x; p.ny = t.y; p.nhb = t.hb; p.nfire = false;
        p.ntxt = isText; p.ndim = 1;
        if (isText) {   // متن: فنر محکم‌تر، ذره ریزتر، رنگ روشن
          p.nk = rand(38, 60); p.ns = rand(1.3, 2.3); p.nc = LIGHT[(Math.random() * LIGHT.length) | 0];
        } else {
          p.nk = rand(14, 30); p.ns = Math.random() < 0.15 ? rand(4.8, 7) : rand(2.6, 4.6); p.nbr = rand(0.6, 1);
          p.hbin = Math.min(7, (Math.hypot(t.x - cw / 2, t.y - ch * 0.47) / (S * 1.25) * 8) | 0); p.nc = (Math.random() * COLORS.length) | 0;
        }
      } else {
        p.nx = rand(0, cw); p.ny = rand(0, ch); p.nhb = false; p.nfire = true; p.nk = 1.3; p.ns = rand(4, 8);
        p.ntxt = false; p.ndim = isText ? 0.45 : 1;   // ذرات اضافه پشت متن کم‌نورتر تا حروف شلوغ نشن
        p.nc = (Math.random() * COLORS.length) | 0;
      }
    });
  }

  function layoutAll() {
    N = Math.max(2200, Math.min(3800, Math.floor(cw * ch / 150)));
    pts = SCENES.map(s => s.type === 'heart' ? heartPoints() : textPoints(s.lines));
    while (parts.length < N) parts.push(makeParticle());
    parts.length = N;
    if (sceneIdx >= 0) goScene(sceneIdx);
  }

  // ---------- حلقه اصلی ----------
  function frame(ts) {
    if (last === null) last = ts;
    const dt = Math.min((ts - last) / 1000, 0.033);
    last = ts; clock += dt * 1000; sceneT += dt;
    const t = clock / 1000;

    if (sceneIdx < 0 && clock > 1000) goScene(0);
    else if (sceneIdx >= 0 && sceneT > SCENES[sceneIdx].hold) goScene(sceneIdx + 1);

    const isHeart = sceneIdx >= 0 && SCENES[sceneIdx].type === 'heart';
    heartAmt += ((isHeart ? 1 : 0) - heartAmt) * Math.min(1, dt * 3);
    const ph = (t * 1.1) % 1;
    const beat = Math.pow(Math.max(0, Math.sin(ph * 6.283)), 6) * 0.075 + Math.pow(Math.max(0, Math.sin(ph * 6.283 - 1.2)), 6) * 0.04;
    if (lastPh < 0.22 && ph >= 0.22) { if (heartAmt > 0.6) rings.push({ life: 1 }); if (heartAmt > 0.85) buzz(48); }   // لاب (قوی)
    if (lastPh < 0.41 && ph >= 0.41 && heartAmt > 0.85) buzz(30);                                                      // داب (ملایم‌تر)
    lastPh = ph;
    const bs = 1 + beat * heartAmt, hcx = cw / 2, hcy = ch * 0.47;
    const beats = [];
    for (let b = 0; b < 8; b++) { const q = ((ph - b * 0.012) % 1 + 1) % 1; beats.push(Math.pow(Math.max(0, Math.sin(q * 6.283)), 6) * 0.075 + Math.pow(Math.max(0, Math.sin(q * 6.283 - 1.2)), 6) * 0.04); }

    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(bgCanvas, 0, 0);

    ctx.globalCompositeOperation = 'lighter';
    orbs.forEach(o => {
      const x = o.x + Math.sin(t * o.sp + o.ph) * 40, y = o.y + Math.cos(t * o.sp * 1.3 + o.ph) * 30;
      ctx.drawImage(o.cvs, x - o.r, y - o.r);
    });
    ctx.globalCompositeOperation = 'source-over';

    ctx.fillStyle = '#fff';
    stars.forEach(s => {
      ctx.globalAlpha = 0.25 + 0.55 * Math.abs(Math.sin(t * s.sp + s.ph));
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    });

    nextShoot -= dt * 1000;
    if (nextShoot < 0 && !shoot) { shoot = { x: rand(cw * 0.4, cw), y: rand(0, ch * 0.3), vx: -rand(500, 800), vy: rand(250, 400), life: 1 }; nextShoot = rand(6000, 10000); }
    if (shoot) {
      shoot.x += shoot.vx * dt; shoot.y += shoot.vy * dt; shoot.life -= dt * 0.9;
      ctx.globalAlpha = Math.max(shoot.life, 0);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(shoot.x - shoot.vx * 0.12, shoot.y - shoot.vy * 0.12); ctx.stroke();
      if (shoot.life <= 0) shoot = null;
    }

    if (heartAmt > 0.01) {
      ctx.globalCompositeOperation = 'lighter';
      const gr = S * (2.2 + beat * 3);
      const g = ctx.createRadialGradient(hcx, hcy, 0, hcx, hcy, gr);
      g.addColorStop(0, `rgba(255,50,110,${0.2 * heartAmt})`); g.addColorStop(1, 'rgba(255,50,110,0)');
      ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
      rings.forEach(r => {
        r.life -= dt * 0.85;
        ctx.globalAlpha = Math.max(r.life, 0) * 0.35; ctx.strokeStyle = '#ff6fa5'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(hcx, hcy, S * (1 + (1 - r.life) * 1.5), 0, 6.283); ctx.stroke();
      });
      rings = rings.filter(r => r.life > 0);
      ctx.globalCompositeOperation = 'source-over';
    }

    petals.forEach((p, i) => {
      p.y += p.vy * dt; p.rot += dt * 0.8;
      if (p.y > ch + 20) petals[i] = newPetal(false);
      ctx.save();
      ctx.globalAlpha = p.a;
      ctx.translate(p.x + Math.sin(t * p.fr + p.ph) * p.amp, p.y);
      ctx.rotate(p.rot); ctx.scale(Math.cos(t * p.spin + p.ph), 1);
      ctx.beginPath(); ctx.ellipse(0, 0, p.s * 0.6, p.s, 0, 0, 6.283);
      ctx.fillStyle = 'hsl(345,80%,62%)'; ctx.fill();
      ctx.restore();
    });

    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (p.delay > 0) {
        p.delay -= dt;
        if (p.delay <= 0) { p.tx = p.nx; p.ty = p.ny; p.hb = p.nhb; p.fire = p.nfire; p.k = p.nk; p.s = p.ns; p.txt = p.ntxt; p.dim = p.ndim; p.br = p.nbr; p.c = p.nc; }
      }
      if (p.fire && Math.random() < dt * 0.25) { p.tx = Math.random() * cw; p.ty = Math.random() * ch; }
      const tx = p.hb ? hcx + (p.tx - hcx) * (1 + beats[p.hbin] * heartAmt) + Math.sin(t * 0.5 * p.tf + p.ph) * 2.6 : p.tx, ty = p.hb ? hcy + (p.ty - hcy) * (1 + beats[p.hbin] * heartAmt) + Math.cos(t * 0.4 * p.tf + p.ph * 1.3) * 2.6 : p.ty;
      const dx = tx - p.x, dy = ty - p.y;
      let ax = dx * p.k - p.vx * 1.5 * Math.sqrt(p.k) - dy * p.sw * 2.5;
      let ay = dy * p.k - p.vy * 1.5 * Math.sqrt(p.k) + dx * p.sw * 2.5;
      p.sw *= Math.pow(0.35, dt);
      const px = p.x - ptr.x, py = p.y - ptr.y, d2 = px * px + py * py;
      if (d2 < 10000) { const d = Math.sqrt(d2) + 0.01, f = Math.pow(1 - d / 100, 2) * 2600; ax += px / d * f; ay += py / d * f; }
      p.vx += ax * dt; p.vy += ay * dt; p.x += p.vx * dt; p.y += p.vy * dt;

      const tw = 0.65 + 0.35 * Math.sin(t * p.tf + p.ph);
      // ذرات متن: پرنور و ثابت، بدون لرزش؛ بقیه مثل قبل
      ctx.globalAlpha = (p.txt ? 0.9 + 0.1 * tw : p.hb ? (0.5 + 0.4 * tw) * p.br : (p.fire ? 0.38 + 0.4 * tw : 0.65 + 0.35 * tw)) * p.dim;
      const sz = p.s * (p.fire ? 1 : 1.15), wob = p.txt ? 0 : Math.sin(t * 1.3 + p.ph) * 0.8;
      ctx.drawImage((p.txt || p.dim < 1 || (p.hb && p.s < 4.2) ? sprites : glow)[p.c], p.x - sz + wob, p.y - sz, sz * 2, sz * 2);
    }
    ctx.globalCompositeOperation = 'source-over';

    nextHeart -= dt * 1000;
    if (nextHeart < 0) { nextHeart = rand(900, 1800); if (heartAmt > 0.3) hearts.push({ x: rand(cw * 0.15, cw * 0.85), y: ch + 20, s: rand(6, 14), vy: rand(40, 80), ph: rand(0, 6.28), life: 1 }); }
    hearts.forEach(h => {
      h.y -= h.vy * dt; h.life -= dt * 0.22;
      ctx.save(); ctx.globalAlpha = Math.max(h.life, 0) * 0.7;
      ctx.translate(h.x + Math.sin(t * 1.2 + h.ph) * 18, h.y);
      heartPath(ctx, h.s); ctx.fillStyle = 'hsl(345,90%,66%)'; ctx.fill(); ctx.restore();
    });
    hearts = hearts.filter(h => h.life > 0 && h.y > -30);
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  canvas.addEventListener('pointermove', e => { ptr.x = e.clientX; ptr.y = e.clientY; });
  canvas.addEventListener('pointerleave', () => { ptr.x = ptr.y = -999; });
  canvas.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') ptr.x = ptr.y = -999; });
  canvas.addEventListener('pointerdown', e => {
    ptr.x = e.clientX; ptr.y = e.clientY;
    for (let i = 0; i < 6; i++) hearts.push({ x: e.clientX + rand(-30, 30), y: e.clientY + rand(-10, 20), s: rand(7, 15), vy: rand(50, 110), ph: rand(0, 6.28), life: 1 });
  });

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cw = window.innerWidth; ch = window.innerHeight;
    canvas.width = cw * dpr; canvas.height = ch * dpr;
    canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initBackground(); layoutAll();
  }
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); });

  const boot = () => { resize(); requestAnimationFrame(frame); };
  const fontReady = document.fonts ? document.fonts.load('100px "Pacifico"') : Promise.resolve();
  Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).then(boot, boot);
})();
</script>
</body>
</html>
